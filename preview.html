<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Reflex Timer — Preview</title>
<style>
  :root {
    --bg: #0E1116;
    --surface: #1A1F27;
    --on: #E7ECF3;
    --muted: #9AA4B2;
    --primary: #1E5BFF;
    --primary-dark: #0B2C8C;
    --red: #E53935;
    --green: #00C853;
    --amber: #FFC107;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--on);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    touch-action: manipulation; }
  .device {
    max-width: 460px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  header { padding: 14px 20px 6px; display: flex; align-items: center; justify-content: space-between; }
  h1 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .reset {
    background: transparent; border: 0; color: var(--primary);
    font-size: 14px; font-weight: 600; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  }
  .reset:active { background: rgba(30,91,255,0.15); }
  .reset[hidden] { display: none; }

  .modes { display: flex; gap: 6px; padding: 6px 16px 8px; }
  .mode {
    flex: 1; background: var(--surface); color: var(--on);
    border: 0; padding: 10px 6px; border-radius: 12px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .mode .desc { font-weight: 400; font-size: 10px; color: var(--muted); }
  .mode.selected { background: var(--primary); color: white; }
  .mode.selected .desc { color: rgba(255,255,255,0.85); }
  .mode:disabled { opacity: 0.5; cursor: not-allowed; }

  main { flex: 1; padding: 8px 16px; min-height: 0; position: relative; }
  .stage {
    width: 100%; height: 100%; border-radius: 28px; overflow: hidden;
    background: var(--surface); position: relative;
  }
  .stage .center {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; flex-direction: column; gap: 10px;
  }
  .title { font-size: 42px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .title.big { font-size: 76px; }
  .title.mid { font-size: 52px; }
  .body { font-size: 15px; opacity: 0.85; max-width: 280px; }
  .stage.tap-target { cursor: pointer; }
  .stage.blue { background: var(--primary); color: white; }
  .stage.red { background: var(--red); color: white; }
  .stage.green { background: var(--green); color: white; }
  .stage.amber { background: var(--amber); color: #111; }
  .stage.dark { background: var(--primary-dark); color: white; }

  .hud {
    position: absolute; top: 10px; left: 14px; right: 14px;
    display: flex; justify-content: space-between; font-size: 13px;
    font-weight: 700; letter-spacing: 0.04em; pointer-events: none;
    color: rgba(255,255,255,0.85);
  }
  .hud .pill {
    background: rgba(0,0,0,0.25); padding: 4px 10px; border-radius: 999px;
  }

  .target {
    position: absolute; border-radius: 999px; background: white;
    transform: translate(-50%, -50%) scale(0.2);
    box-shadow: 0 0 0 4px rgba(255,255,255,0.18), 0 8px 24px rgba(0,0,0,0.35);
    animation: pop 120ms ease-out forwards;
  }
  .target.hit { animation: bust 220ms ease-out forwards; pointer-events: none; }
  .target.miss {
    animation: missShake 360ms ease-out forwards; pointer-events: none;
    background: radial-gradient(circle at 35% 30%, #fff 0%, #E53935 70%, #7a0000 100%) !important;
    box-shadow: 0 0 0 6px rgba(229,57,53,0.35), 0 8px 24px rgba(229,57,53,0.4) !important;
  }
  @keyframes pop { to { transform: translate(-50%, -50%) scale(1); } }
  @keyframes bust {
    0%   { transform: translate(-50%, -50%) scale(1); }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }
  @keyframes missShake {
    0%   { transform: translate(-50%, -50%) scale(1)    rotate(0); }
    20%  { transform: translate(-58%, -50%) scale(1.05) rotate(-8deg); }
    40%  { transform: translate(-42%, -50%) scale(1.05) rotate(8deg); }
    60%  { transform: translate(-55%, -50%) scale(1)    rotate(-5deg); }
    80%  { transform: translate(-45%, -50%) scale(0.9)  rotate(3deg); opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(0.6)  rotate(0); opacity: 0; }
  }

  .floater {
    position: absolute; pointer-events: none;
    font-weight: 900; font-size: 22px; letter-spacing: -0.01em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    transform: translate(-50%, -50%);
    animation: float 700ms ease-out forwards;
    white-space: nowrap;
  }
  .floater.hit  { color: #FFF59D; }
  .floater.combo { color: var(--amber); font-size: 16px; }
  .floater.miss { color: #FF8A80; }
  @keyframes float {
    0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
    20%  { transform: translate(-50%, -85%) scale(1.15); opacity: 1; }
    100% { transform: translate(-50%, -160%) scale(1); opacity: 0; }
  }

  .hud .pill.score { background: rgba(255,193,7,0.18); color: #FFE082; }
  .hud .pill.combo { background: rgba(255,193,7,0.85); color: #111; }


  .summary { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 24px; }
  .summary h2 { margin: 0 0 4px; font-size: 26px; font-weight: 800; }
  .row { display: flex; align-items: center; font-size: 16px; }
  .row .v { font-weight: 800; margin-left: 8px; font-size: 20px; }
  .row.new .v { color: var(--amber); }
  .badge { background: var(--amber); color: #111; font-weight: 900; font-size: 11px;
    padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
  .all-time { font-size: 12px; opacity: 0.7; margin-top: 6px; }
  .start-cta { font-size: 16px; opacity: 0.9; margin-top: 10px; }

  footer { padding: 8px 20px 18px; text-align: center; }
  .best { color: var(--muted); font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<div class="device">
  <header>
    <h1>Reflex Timer</h1>
    <button class="reset" id="reset" hidden>Reset</button>
  </header>

  <nav class="modes" id="modes"></nav>

  <main>
    <div class="stage" id="stage"></div>
  </main>

  <footer>
    <div class="best" id="best"></div>
  </footer>
</div>

<script>
/* =========================================================
   Game state & shared helpers
   ========================================================= */
const stage = document.getElementById("stage");
const resetBtn = document.getElementById("reset");
const bestEl = document.getElementById("best");
const modesEl = document.getElementById("modes");

const MODES = {
  REACTION: { name: "Reaction", desc: "Tap on green", best: "Avg RT" },
  GONOGO:   { name: "Go / No-Go", desc: "Tap green · Ignore red", best: "Score" },
  WHACK:    { name: "Whack", desc: "20s, tap pop-ups", best: "Hits" },
};

let currentMode = "REACTION";
let game = null;   // active game instance

function bestKey(mode) { return `rt_best_${mode}`; }
function loadBest(mode) {
  const raw = localStorage.getItem(bestKey(mode));
  if (!raw) return null;
  try {
    const v = JSON.parse(raw);
    // Drop legacy whack entries that pre-date scoring
    if (mode === "WHACK" && (v == null || v.score == null)) {
      localStorage.removeItem(bestKey(mode));
      return null;
    }
    return v;
  } catch {
    localStorage.removeItem(bestKey(mode));
    return null;
  }
}
function saveBest(mode, value, lowerIsBetter, metricFn = (v) => v) {
  const cur = loadBest(mode);
  const newMetric = metricFn(value);
  const curMetric = cur ? metricFn(cur) : null;
  const better = curMetric == null
    || (lowerIsBetter ? newMetric < curMetric : newMetric > curMetric);
  if (better) localStorage.setItem(bestKey(mode), JSON.stringify(value));
  return better;
}

function renderModes(disabled) {
  modesEl.innerHTML = "";
  Object.entries(MODES).forEach(([key, m]) => {
    const b = document.createElement("button");
    b.className = "mode" + (currentMode === key ? " selected" : "");
    b.innerHTML = `<div>${m.name}</div><div class="desc">${m.desc}</div>`;
    b.disabled = !!disabled;
    b.onclick = () => { if (!disabled) selectMode(key); };
    modesEl.appendChild(b);
  });
}

function renderBestLine() {
  const v = loadBest(currentMode);
  if (v == null) { bestEl.textContent = ""; return; }
  if (currentMode === "REACTION") bestEl.textContent = `Best (${MODES.REACTION.name}) — avg: ${v.avg}ms · best: ${v.best}ms`;
  if (currentMode === "GONOGO")   bestEl.textContent = `Best (${MODES.GONOGO.name}) — score: ${v.score} (${v.hits}/${v.trials})`;
  if (currentMode === "WHACK")    bestEl.textContent = `Best (${MODES.WHACK.name}) — score: ${v.score} · combo: ×${v.bestCombo ?? 1} · ${v.accuracy ?? 0}%`;
}

function setStage(html, classes = "", tapHandler = null) {
  stage.className = "stage " + classes + (tapHandler ? " tap-target" : "");
  stage.innerHTML = html;
  stage.onpointerdown = tapHandler || null;
}
function showReset(show) { resetBtn.hidden = !show; }

function centerCard(title, body, titleClass = "title") {
  return `<div class="center"><div class="${titleClass}">${title}</div>${body ? `<div class="body">${body}</div>` : ""}</div>`;
}

function selectMode(key) {
  if (currentMode === key) return;
  currentMode = key;
  if (game && game.cleanup) game.cleanup();
  game = null;
  renderModes(false);
  renderBestLine();
  startCurrentMode();
}

resetBtn.onclick = () => {
  if (game && game.cleanup) game.cleanup();
  game = null;
  renderModes(false);
  showReset(false);
  startCurrentMode();
};

/* =========================================================
   Mode 1: Reaction (classic)
   ========================================================= */
function startReaction() {
  const TARGET = 5;
  const state = { rounds: [], phase: "idle", waitTimer: null, goStart: 0 };

  function cleanup() { if (state.waitTimer) clearTimeout(state.waitTimer); }
  game = { cleanup };

  function render() {
    if (state.phase === "idle") {
      setStage(centerCard("Tap to start", "5 rounds. When the screen turns green, tap as fast as you can."), "blue", onTap);
      showReset(false);
    } else if (state.phase === "waiting") {
      setStage(centerCard("Wait for green…", "Don't tap yet!"), "red", onTap);
      showReset(true);
    } else if (state.phase === "go") {
      setStage(centerCard("TAP!", null, "title big"), "green", onTap);
      showReset(true);
    } else if (state.phase === "toosoon") {
      setStage(centerCard("Too soon!", "Tap to retry this round."), "amber", onTap);
      showReset(true);
    } else if (state.phase === "round") {
      const sub = `Round ${state.rounds.length} of ${TARGET}. Tap for next.`;
      setStage(centerCard(`${state.last} ms`, sub, "title mid"), "dark", onTap);
      showReset(true);
    } else if (state.phase === "done") {
      const best = Math.min(...state.rounds);
      const avg = Math.round(state.rounds.reduce((a,b)=>a+b,0) / state.rounds.length);
      const prev = loadBest("REACTION");
      const isNew = !prev || avg < prev.avg;
      if (isNew) saveBest("REACTION", { avg, best }, true, v => v.avg);
      const allTime = loadBest("REACTION");
      const html = `
        <div class="summary">
          <h2>Session complete</h2>
          <div class="row ${isNew ? "new" : ""}">Average:<span class="v">${avg} ms</span>${isNew ? '<span class="badge">NEW</span>' : ""}</div>
          <div class="row">Best round:<span class="v">${best} ms</span></div>
          <div class="all-time">All-time best avg: ${allTime.avg}ms · single: ${allTime.best}ms</div>
          <div class="start-cta">Tap to play again</div>
        </div>`;
      setStage(html, "dark", () => { game = null; startReaction(); });
      showReset(true);
      renderBestLine();
    }
  }

  function onTap() {
    if (state.phase === "idle" || state.phase === "toosoon") {
      state.phase = "waiting"; render();
      const delay = 800 + Math.random() * 2200;
      state.waitTimer = setTimeout(() => {
        if (state.phase === "waiting") { state.phase = "go"; state.goStart = performance.now(); render(); }
      }, delay);
    } else if (state.phase === "waiting") {
      clearTimeout(state.waitTimer); state.phase = "toosoon"; render();
    } else if (state.phase === "go") {
      state.last = Math.round(performance.now() - state.goStart);
      state.rounds.push(state.last);
      state.phase = state.rounds.length >= TARGET ? "done" : "round";
      render();
    } else if (state.phase === "round") {
      state.phase = "waiting"; render();
      const delay = 800 + Math.random() * 2200;
      state.waitTimer = setTimeout(() => {
        if (state.phase === "waiting") { state.phase = "go"; state.goStart = performance.now(); render(); }
      }, delay);
    }
  }

  render();
}

/* =========================================================
   Mode 2: Go / No-Go
   Green stimulus = tap. Red stimulus = DON'T tap.
   12 trials. Score = +2 hits, -2 false alarms, -1 misses.
   ========================================================= */
function startGoNoGo() {
  const TRIALS = 12;
  const STIMULUS_MS = 900;
  const ITI_MIN = 600, ITI_MAX = 1600;

  const state = {
    phase: "idle",         // idle | iti | stim | done
    stimulus: null,        // "go" | "nogo"
    trial: 0,
    hits: 0, misses: 0, falseAlarms: 0, correctRejects: 0,
    rts: [],
    stimStart: 0,
    timers: [],
  };

  function cleanup() { state.timers.forEach(clearTimeout); state.timers = []; }
  game = { cleanup };

  function schedule(fn, ms) { const id = setTimeout(fn, ms); state.timers.push(id); return id; }

  function score() {
    return state.hits * 2 - state.falseAlarms * 2 - state.misses;
  }

  function render() {
    if (state.phase === "idle") {
      setStage(centerCard("Go / No-Go",
        "Green = tap fast. Red = DON'T tap.<br>12 trials. Tap to start."), "blue", onTap);
      showReset(false); return;
    }
    if (state.phase === "iti") {
      const hud = `<div class="hud"><span class="pill">Trial ${state.trial + 1}/${TRIALS}</span><span class="pill">Score ${score()}</span></div>`;
      setStage(hud + centerCard("•", "Get ready…", "title big"), "dark", onTap);
      showReset(true); return;
    }
    if (state.phase === "stim") {
      const hud = `<div class="hud"><span class="pill">Trial ${state.trial + 1}/${TRIALS}</span><span class="pill">Score ${score()}</span></div>`;
      if (state.stimulus === "go") setStage(hud + centerCard("GO", null, "title big"), "green", onTap);
      else                          setStage(hud + centerCard("NO", null, "title big"), "red",   onTap);
      showReset(true); return;
    }
    if (state.phase === "done") {
      const s = score();
      const trials = state.hits + state.misses + state.falseAlarms + state.correctRejects;
      const isNew = saveBest("GONOGO", { score: s, hits: state.hits, trials }, false, v => v.score);
      const avgRT = state.rts.length ? Math.round(state.rts.reduce((a,b)=>a+b,0)/state.rts.length) : "—";
      const html = `
        <div class="summary">
          <h2>Done</h2>
          <div class="row ${isNew ? "new" : ""}">Score:<span class="v">${s}</span>${isNew ? '<span class="badge">NEW</span>' : ""}</div>
          <div class="row">Hits:<span class="v">${state.hits}</span></div>
          <div class="row">False alarms:<span class="v">${state.falseAlarms}</span></div>
          <div class="row">Misses:<span class="v">${state.misses}</span></div>
          <div class="row">Avg RT:<span class="v">${avgRT}${avgRT === "—" ? "" : " ms"}</span></div>
          <div class="start-cta">Tap to play again</div>
        </div>`;
      setStage(html, "dark", () => { game = null; startGoNoGo(); });
      showReset(true); renderBestLine();
    }
  }

  function nextTrial() {
    if (state.trial >= TRIALS) { state.phase = "done"; render(); return; }
    state.phase = "iti"; render();
    const iti = ITI_MIN + Math.random() * (ITI_MAX - ITI_MIN);
    schedule(() => {
      state.stimulus = Math.random() < 0.7 ? "go" : "nogo";
      state.phase = "stim";
      state.stimStart = performance.now();
      render();
      schedule(() => {
        if (state.phase !== "stim") return;
        // Timeout for current stimulus
        if (state.stimulus === "go") state.misses++;
        else state.correctRejects++;
        state.trial++;
        nextTrial();
      }, STIMULUS_MS);
    }, iti);
  }

  function onTap() {
    if (state.phase === "idle") { nextTrial(); return; }
    if (state.phase === "iti") {
      // tapping during ITI is a false alarm against current trial intent — treat as false alarm
      state.falseAlarms++;
      cleanup();
      state.trial++;
      nextTrial();
      return;
    }
    if (state.phase === "stim") {
      cleanup();
      if (state.stimulus === "go") {
        state.hits++;
        state.rts.push(Math.round(performance.now() - state.stimStart));
      } else {
        state.falseAlarms++;
      }
      state.trial++;
      nextTrial();
    }
  }

  render();
}

/* =========================================================
   Mode 3: Whack
   20s round, targets pop up at random positions in the stage.
   Tap them before they expire. Score = hits.
   ========================================================= */
function startWhack() {
  const DURATION_MS  = 20000;
  const SPAWN_START  = 850;
  const SPAWN_MIN    = 360;
  const LIFETIME_START = 1200;
  const LIFETIME_MIN   = 600;
  const BASE_POINTS  = 50;
  const SPEED_BONUS  = 150;       // up to +150 for instantaneous taps
  const MAX_COMBO    = 9;         // multiplier capped at x10

  const state = {
    phase: "idle",
    hits: 0, misses: 0,
    score: 0, combo: 0, bestCombo: 0,
    startTime: 0,
    spawnTimer: null, endTimer: null, hudTimer: null,
    targets: new Set(),
  };

  function cleanup() {
    clearTimeout(state.spawnTimer);
    clearTimeout(state.endTimer);
    clearInterval(state.hudTimer);
    state.targets.forEach(t => t.cleanup && t.cleanup());
    state.targets.clear();
  }
  game = { cleanup };

  const lerp = (a, b, t) => a + (b - a) * t;
  const progress = () => Math.min(1, (performance.now() - state.startTime) / DURATION_MS);

  function paintHud() {
    const remain = Math.max(0, DURATION_MS - (performance.now() - state.startTime));
    const seconds = (remain / 1000).toFixed(1);
    const hud = stage.querySelector(".hud");
    if (!hud) return;
    const comboPill = state.combo > 1
      ? `<span class="pill combo">×${state.combo} COMBO</span>` : "";
    hud.innerHTML = `<span class="pill">${seconds}s</span>${comboPill}<span class="pill score">${state.score}</span>`;
  }

  function spawnFloater(x, y, text, kind) {
    const el = document.createElement("div");
    el.className = `floater ${kind}`;
    el.style.left = x + "px";
    el.style.top  = y + "px";
    el.textContent = text;
    stage.appendChild(el);
    setTimeout(() => el.remove(), 720);
  }

  function spawnTarget() {
    const rect = stage.getBoundingClientRect();
    const margin = 50;
    const x = margin + Math.random() * (rect.width - margin * 2);
    const y = 70 + Math.random() * (rect.height - 120);
    const size = 58 + Math.random() * 26;
    const el = document.createElement("div");
    el.className = "target";
    el.style.left = x + "px";
    el.style.top  = y + "px";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.background = "radial-gradient(circle at 35% 30%, #fff 0%, #FFC107 60%, #E53935 100%)";
    stage.appendChild(el);

    const lifetime = lerp(LIFETIME_START, LIFETIME_MIN, progress());
    const bornAt = performance.now();
    let resolved = false;
    const target = {
      cleanup: () => { clearTimeout(target.timer); el.remove(); state.targets.delete(target); },
    };

    target.timer = setTimeout(() => {
      if (resolved) return; resolved = true;
      // Miss: target expired
      state.misses++;
      const wasCombo = state.combo;
      state.combo = 0;
      el.classList.add("miss");
      spawnFloater(x, y, "MISS", "miss");
      if (wasCombo > 1) spawnFloater(x, y + 22, `× broken`, "miss");
      clearTimeout(target.timer);
      setTimeout(() => target.cleanup(), 360);
      paintHud();
    }, lifetime);

    el.addEventListener("pointerdown", (ev) => {
      ev.stopPropagation();
      if (resolved) return; resolved = true;
      const elapsed = performance.now() - bornAt;
      const speedRatio = Math.max(0, 1 - elapsed / lifetime);    // 1 = instant, 0 = last possible ms
      const points = Math.round(BASE_POINTS + SPEED_BONUS * speedRatio);
      const multiplier = state.combo + 1;
      const gained = points * multiplier;
      state.hits++;
      state.score += gained;
      state.combo = Math.min(state.combo + 1, MAX_COMBO);
      if (state.combo > state.bestCombo) state.bestCombo = state.combo;

      el.classList.add("hit");
      spawnFloater(x, y, `+${gained}`, "hit");
      if (multiplier > 1) spawnFloater(x, y + 24, `×${multiplier}`, "combo");
      clearTimeout(target.timer);
      setTimeout(() => target.cleanup(), 220);
      paintHud();
    });

    state.targets.add(target);
  }

  function scheduleNextSpawn() {
    const interval = lerp(SPAWN_START, SPAWN_MIN, progress());
    state.spawnTimer = setTimeout(() => {
      if (state.phase !== "playing") return;
      spawnTarget();
      scheduleNextSpawn();
    }, interval);
  }

  function render() {
    if (state.phase === "idle") {
      setStage(centerCard("Whack",
        "20 seconds. Tap targets fast for big points.<br>Chain hits to build a combo. Misses break it.<br>Tap to start."),
        "blue", onTap);
      showReset(false); return;
    }
    if (state.phase === "playing") {
      const hud = `<div class="hud"><span class="pill">20.0s</span><span class="pill score">0</span></div>`;
      setStage(hud, "dark");
      paintHud();
      showReset(true); return;
    }
    if (state.phase === "done") {
      const totalAttempts = state.hits + state.misses;
      const accuracy = totalAttempts ? Math.round((state.hits / totalAttempts) * 100) : 0;
      const isNew = saveBest("WHACK", {
        score: state.score, hits: state.hits, misses: state.misses,
        bestCombo: state.bestCombo, accuracy,
      }, false, v => v.score ?? 0);
      const html = `
        <div class="summary">
          <h2>Time!</h2>
          <div class="row ${isNew ? "new" : ""}">Score:<span class="v">${state.score}</span>${isNew ? '<span class="badge">NEW</span>' : ""}</div>
          <div class="row">Hits:<span class="v">${state.hits}</span></div>
          <div class="row">Missed:<span class="v">${state.misses}</span></div>
          <div class="row">Best combo:<span class="v">×${state.bestCombo}</span></div>
          <div class="row">Accuracy:<span class="v">${accuracy}%</span></div>
          <div class="start-cta">Tap to play again</div>
        </div>`;
      setStage(html, "dark", () => { game = null; startWhack(); });
      showReset(true); renderBestLine();
    }
  }

  function onTap() {
    if (state.phase === "idle") {
      state.phase = "playing";
      state.startTime = performance.now();
      render();
      state.hudTimer = setInterval(paintHud, 100);
      state.endTimer = setTimeout(() => {
        state.phase = "done";
        cleanup();
        render();
      }, DURATION_MS);
      scheduleNextSpawn();
    }
  }

  render();
}

/* =========================================================
   Dispatch
   ========================================================= */
function startCurrentMode() {
  if      (currentMode === "REACTION") startReaction();
  else if (currentMode === "GONOGO")   startGoNoGo();
  else if (currentMode === "WHACK")    startWhack();
}

renderModes(false);
renderBestLine();
startCurrentMode();
</script>
</body>
</html>
