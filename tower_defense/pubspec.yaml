name: tower_defense
description: A production-ready tower defense game with AdMob and IAP monetization.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0
  riverpod: ^2.6.0
  flutter_riverpod: ^2.6.0
  shared_preferences: ^2.2.3
  go_router: ^14.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
